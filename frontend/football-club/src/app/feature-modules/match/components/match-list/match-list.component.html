<div class="page-container">
  
  <div class="header-row">
    <h1>Raspored i pregled utakmica</h1>
    
    <div class="search-wrapper">
      <input 
        type="text" 
        placeholder="Pretraži po timovima..." 
        [(ngModel)]="searchQuery" 
        (input)="onSearchChange(searchQuery)" 
      />
      <span class="search-icon">🔍</span>
    </div>

    <button 
      *ngIf="isStatistician" 
      (click)="goToMatchEntry()"
      class="btn-add">
      ➕ Unesi novu utakmicu
    </button>
  </div>
  
  <table class="match-table">
    <thead>
      <tr>
        <th>Datum i vreme</th>
        <th>Domaćin</th>
        <th>Gost</th>
        <th *ngIf="canViewDetails">Akcija</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let match of filteredMatches">
        <td>{{ match.dateTime | date:'dd.MM.yyyy HH:mm' }}</td>
        <td>{{ match.homeClubName }}</td>
        <td>{{ match.awayClubName }}</td>
        <td *ngIf="canViewDetails">
          <button class="btn-details" (click)="viewMatchDetails(match.id)">Pregled detalja</button>
          <button *ngIf="canGenerateReport" class="btn-report" style="margin-left: 8px;" 
            (click)="downloadReport(match.id)"> 📄 Preuzmi izveštaj </button>
        </td>
      </tr>

      <tr *ngIf="filteredMatches.length === 0">
        <td colspan="4" style="text-align: center; color: #999; font-style: italic;">
          Nema pronađenih utakmica za zadati kriterijum.
        </td>
      </tr>
    </tbody>
  </table>
</div>
