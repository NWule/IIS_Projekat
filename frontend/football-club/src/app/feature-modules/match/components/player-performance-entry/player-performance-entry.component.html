  <a routerLink="/unos-igraca">Unesi igraca</a>
  <a routerLink="/performanse-igraca" class="active">Unesi performanese igraca</a>
</nav>

<div class="form-container">
  <h1 class="page-title">Unos performansi sa odigrane utakmice</h1>

  <form [formGroup]="performanceForm" (ngSubmit)="onSubmit()">
    <div class="main-layout">
      
      <div class="fields-column">
        
        <div class="input-row">
          <label for="igrac">Igrač</label>
          <select id="igrac" formControlName="playsForId">
            <option [value]="null">Izaberite igrača</option>
            <option *ngFor="let player of players" [value]="player.id">
              {{ player.name }} {{ player.surname }}
            </option>
          </select>
        </div>

        <div class="input-row">
          <label for="minuti">Minuti</label>
          <input id="minuti" type="number" formControlName="minutesPlayed" />
        </div>

        <div class="input-row">
          <label for="golovi">Golovi</label>
          <input id="golovi" type="number" formControlName="goals" />
        </div>

        <div class="input-row">
          <label for="asistencije">Asistencije</label>
          <input id="asistencije" type="number" formControlName="assists" />
        </div>

        <div class="input-row">
          <label for="procenat">Procenat uspešnih dodavanja</label>
          <input id="procenat" type="number" formControlName="passingAccuracy" />
        </div>

        <div class="input-row">
          <label for="faulovi">Faulovi</label>
          <input id="faulovi" type="number" formControlName="fouls" />
        </div>

      </div>

      <div class="checkbox-column">
        
        <div class="checkbox-row">
          <label for="zuti">Žuti karton</label>
          <input id="zuti" type="checkbox" formControlName="yellowCardCheckbox" />
        </div>

        <div class="checkbox-row">
          <label for="crveni">Crveni karton</label>
          <input id="crveni" type="checkbox" formControlName="redCard" />
        </div>

      </div>

    </div>

    <div class="submit-wrapper">
      <button type="submit" class="submit-btn" [disabled]="performanceForm.invalid">Potvrdi</button>
    </div>
  </form>
</div>
