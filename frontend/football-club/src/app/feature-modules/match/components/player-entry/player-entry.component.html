<nav class="top-nav">
  <a routerLink="/unos-kluba">Unesi tim</a>
  <a routerLink="/unos-igraca" class="active">Unesi igraca</a>
  <a routerLink="/performanse-igraca">Unesi performanese igraca</a>
</nav>

<div class="form-container">
  <h1 class="page-title">Unos igrača</h1>

  <form [formGroup]="playerForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      
      <div class="column left-column">
        <div class="input-group">
          <label for="ime">Ime</label>
          <input id="ime" type="text" formControlName="ime" />
        </div>

        <div class="input-group">
          <label for="prezime">Prezime</label>
          <input id="prezime" type="text" formControlName="prezime" />
        </div>

        <div class="input-group">
          <label for="datumRodjenja">Datum rođenja</label>
          <input id="datumRodjenja" type="date" formControlName="datumRodjenja" />
        </div>

        <div class="input-group">
          <label for="pozicija">Pozicija</label>
          <input id="pozicija" type="text" formControlName="pozicija" />
        </div>
      </div>

      <div class="column right-column">
        <div class="input-group">
          <label for="trenutniKlub">Trenutni klub</label>
          <select id="trenutniKlub" formControlName="trenutniKlubId">
            <option [value]="null">Nema kluba</option>
            <option *ngFor="let club of clubs" [value]="club.id">{{ club.name }}</option>
          </select>
        </div>

        <div class="input-group">
          <label for="brojNaDresu">Broj na dresu</label>
          <input id="brojNaDresu" type="number" formControlName="brojNaDresu" />
        </div>

        <div class="input-group">
          <label for="contractStart">Početak ugovora</label>
          <input id="contractStart" type="date" formControlName="contractStart" />
        </div>

        <div class="input-group">
          <label for="contractEnd">Kraj ugovora</label>
          <input id="contractEnd" type="date" formControlName="contractEnd" />
        </div>
      </div>

    </div>

    <div class="submit-wrapper">
      <button type="submit" class="submit-btn" [disabled]="playerForm.invalid">Potvrdi</button>
    </div>
  </form>
</div>
