<nav class="top-nav">
  <a routerLink="/timovi" class="active">Timovi</a>
  <a routerLink="/priprema-utakmice">Priprema utakmice</a>
  <a routerLink="/utakmica-uzivo">Utakmica uzivo</a>
</nav>

<div class="page-container">
  <h1 class="page-title">Timovi</h1>

  <div class="search-wrapper">
    <input 
      type="text" 
      placeholder="Pretraži klubove..." 
      [(ngModel)]="searchQuery" 
      (input)="onSearchChange(searchQuery)" 
    />
    <span class="search-icon">🔍</span>
  </div>

  <div class="clubs-grid">
    <div 
      class="club-card" 
      *ngFor="let club of clubs"
      [class.my-club-card]="club.id === myClubId"
    >
      <div class="image-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="placeholder-icon">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      <div class="club-name">{{ club.name }}</div>
      <span *ngIf="club.id === myClubId" class="badge-my">Moj Klub</span>
    </div>
  </div>
</div>
