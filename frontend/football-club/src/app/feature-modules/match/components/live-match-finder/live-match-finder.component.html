<div class="page-container" *ngIf="!isLoadingClub; else loadingClubTpl">
  <div class="finder-card">
    
    <div class="header-section">
      <h2>⚽ Trenerski Live Panel</h2>
      <p class="club-subtitle">Vaš klub: <strong>{{ myClub?.name }}</strong></p>
    </div>

    <div class="center-action">
      <p class="instructions">
        Klikom na dugme ispod, sistem će proveriti da li vaš klub trenutno igra utakmicu.
      </p>

      <button class="btn-search-live" [disabled]="isSearchingMatch" (click)="findLiveMatch()">
        <span *ngIf="!isSearchingMatch">🔍 Pronađi utakmicu i uđi na panel</span>
        <span *ngIf="isSearchingMatch">🔄 Provera u toku...</span>
      </button>
    </div>

    <div *ngIf="noMatchFound" class="error-banner">
      ⚠️ <strong>Nema aktivnih utakmica!</strong><br>
      Vaš klub trenutno nema nijednu pokrenutu utakmicu, bice dostupno kada statisticar pokrene utakmicu.
    </div>

  </div>
</div>

<ng-template #loadingClubTpl>
  <div class="loading-state">Učitavanje podataka o klubu...</div>
</ng-template>
