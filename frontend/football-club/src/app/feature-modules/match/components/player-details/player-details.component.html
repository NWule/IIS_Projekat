

<div class="page-container" *ngIf="!isLoading && player">
  
  <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 class="page-title" style="margin-bottom: 0;">{{ player?.name }} {{ player?.surname }}</h1>

    <button 
      *ngIf="isAssistantCoach" 
      (click)="goToEditPlayer()"
      style="background: #0b133d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      ✏️ Uredi igrača
    </button>
  </div>

  <div class="main-layout">
    
    <div class="player-profile-card">
      <div class="player-photo-placeholder">
        <img *ngIf="playerImageUrl" [src]="playerImageUrl" alt="Profilna slika" class="real-player-photo">

        <svg *ngIf="!playerImageUrl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="big-placeholder-icon">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>

      </div>

      <div class="info-list">
        <div class="info-row">
          <span class="info-label">Datum rođenja:</span>
          <span class="info-value">{{ player?.dateOfBirth }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Trenutni klub:</span>
          <span class="info-value">{{ currentContract?.clubName || 'Nema kluba (Slobodan igrač)' }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Broj na dresu:</span>
          <span class="info-value">{{ currentContract ? currentContract.jerseyNumber : '-' }}</span>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="loading-placeholder" *ngIf="isLoading">
  <p>Učitavanje detalja o igraču...</p>
</div>
