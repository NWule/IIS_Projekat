<div class="match-container">
  <h1 class="page-title">Unos odigrane utakmice</h1>

  <form [formGroup]="matchForm" (ngSubmit)="onSubmit()">
    
    <div class="team-selectors">
      <div class="selector-group">
        <label>Domaćin</label>
        <select formControlName="homeClubId">
          <option [value]="null">Nema kluba</option>
          <option *ngFor="let club of clubs" [value]="club.id">{{ club.name }}</option>
        </select>
      </div>

      <div class="selector-group">
        <label>Gost</label>
        <select formControlName="awayClubId">
          <option [value]="null">Nema kluba</option>
          <option *ngFor="let club of clubs" [value]="club.id">{{ club.name }}</option>
        </select>
      </div>
    </div>

    <div *ngIf="matchForm.errors?.['sameClubs'] && matchForm.touched" class="error-msg">
      Domaćin i gost ne mogu biti isti klub!
    </div>

    <div class="statistics-grid">
      
      <input type="number" formControlName="homeGoals" />
      <div class="stat-label">Golovi</div>
      <input type="number" formControlName="awayGoals" />

      <input type="number" formControlName="homeShots" />
      <div class="stat-label">Šutevi</div>
      <input type="number" formControlName="awayShots" />

      <input type="number" formControlName="homeShotsOnTarget" />
      <div class="stat-label">Šutevi u okvir</div>
      <input type="number" formControlName="awayShotsOnTarget" />

      <input type="number" formControlName="homePossession" />
      <div class="stat-label">Posed lopte</div>
      <input type="number" formControlName="awayPossession" />

      <input type="number" formControlName="homeCorners" />
      <div class="stat-label">Korneri</div>
      <input type="number" formControlName="awayCorners" />

      <input type="number" formControlName="homeFouls" />
      <div class="stat-label">Faulovi</div>
      <input type="number" formControlName="awayFouls" />

      <input type="number" formControlName="homeOffsides" />
      <div class="stat-label">Ofsajdi</div>
      <input type="number" formControlName="awayOffsides" />

      <input type="number" formControlName="homePassAccuracy" />
      <div class="stat-label">Procenat uspešnih dodavanja</div>
      <input type="number" formControlName="awayPassAccuracy" />

    </div>

    <div class="date-section">
      <div class="stat-label date-title">Datum odigravanja</div>
      <div class="date-inputs">
        <input type="number" placeholder="DD" formControlName="day" />
        <input type="number" placeholder="MM" formControlName="month" />
        <input type="number" placeholder="YYYY" formControlName="year" />
      </div>
    </div>

    <div class="submit-wrapper">
      <button type="submit" class="submit-btn" [disabled]="matchForm.invalid">Potvrdi</button>
    </div>

  </form>
</div>
