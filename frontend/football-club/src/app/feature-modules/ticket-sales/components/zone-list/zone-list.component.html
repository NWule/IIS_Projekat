<div class="page-container">
  <div class="page-header">
    <h1>Zone stadiona</h1>
    <button class="btn-add" (click)="addZone()">+ Dodaj zonu</button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

  <div *ngIf="!loading">
    <div *ngIf="zones.length === 0" class="empty-state">Nema unetih zona. Dodajte prvu zonu.</div>

    <table *ngIf="zones.length > 0" class="data-table">
      <thead>
        <tr>
          <th>Boja</th>
          <th>Naziv</th>
          <th>Bazna cena</th>
          <th>Redovi</th>
          <th>Sedišta/red</th>
          <th>Ukupno sedišta</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let zone of zones">
          <td>
            <span class="color-dot" [style.background]="zone.color" [title]="zone.color"></span>
          </td>
          <td><strong>{{ zone.name }}</strong></td>
          <td>{{ zone.basePrice | number:'1.2-2' }} €</td>
          <td>{{ zone.numberOfRows }}</td>
          <td>{{ zone.seatsPerRow }}</td>
          <td>{{ totalSeats(zone) }}</td>
          <td class="actions">
            <button class="btn-seats" (click)="manageSeats(zone.id!)">Sedišta</button>
            <button class="btn-edit" (click)="editZone(zone.id!)">Izmeni</button>
            <button class="btn-delete" (click)="deleteZone(zone)">Obriši</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
