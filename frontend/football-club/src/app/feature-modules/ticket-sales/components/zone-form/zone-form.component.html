<div class="page-container">
  <h1>{{ title }}</h1>

  <div *ngIf="fetchLoading" class="loading">Učitavanje...</div>

  <div class="form-card" *ngIf="!fetchLoading">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Naziv zone *</label>
        <input type="text" formControlName="name" placeholder="npr. Sever, VIP, Jug..." />
        <span class="hint" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Obavezno polje</span>
      </div>

      <div class="form-group">
        <label>Boja zone *</label>
        <div class="color-row">
          <input type="color" formControlName="color" />
          <span class="color-preview">{{ form.get('color')?.value }}</span>
        </div>
      </div>

      <div class="form-group">
        <label>Bazna cena (RSD) *</label>
        <input type="number" formControlName="basePrice" placeholder="0.00" min="0" step="0.01" />
        <span class="hint" *ngIf="form.get('basePrice')?.touched && form.get('basePrice')?.invalid">
          Unesite validnu cenu (≥ 0)
        </span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Broj redova *</label>
          <input type="number" formControlName="numberOfRows" placeholder="10" min="1" />
          <span class="hint" *ngIf="form.get('numberOfRows')?.touched && form.get('numberOfRows')?.invalid">
            Minimum 1
          </span>
        </div>
        <div class="form-group">
          <label>Sedišta po redu *</label>
          <input type="number" formControlName="seatsPerRow" placeholder="20" min="1" />
          <span class="hint" *ngIf="form.get('seatsPerRow')?.touched && form.get('seatsPerRow')?.invalid">
            Minimum 1
          </span>
        </div>
      </div>

      <div class="total-preview" *ngIf="form.get('numberOfRows')?.value && form.get('seatsPerRow')?.value">
        Ukupno sedišta: <strong>{{ form.get('numberOfRows')?.value * form.get('seatsPerRow')?.value }}</strong>
      </div>

      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="router.navigate(['/zones'])">Otkaži</button>
        <button type="submit" class="btn-primary" [disabled]="loading || form.invalid">
          {{ loading ? 'Čuvanje...' : (isEdit ? 'Sačuvaj izmene' : 'Dodaj zonu') }}
        </button>
      </div>
    </form>
  </div>
</div>
