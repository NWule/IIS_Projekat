<div class="page-container">
  <h1>{{ title }}</h1>
  <div *ngIf="fetchLoading" class="loading">Učitavanje...</div>

  <div class="form-card" *ngIf="!fetchLoading">
    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Naziv pravila *</label>
        <input type="text" formControlName="name" placeholder="npr. Popust 24h pre utakmice" />
        <span class="hint" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Obavezno polje</span>
      </div>

      <div class="section-title">Uslovi primene <span class="optional">(opcionalno — prazno = uvek važi)</span></div>

      <div class="form-row">
        <div class="form-group">
          <label>Prag popunjenosti zone (0–1)</label>
          <div class="hours-row">
            <select formControlName="occupancyConditionAtLeast" class="hours-select">
              <option [ngValue]="true">Više od</option>
              <option [ngValue]="false">Manje od</option>
            </select>
            <input type="number" formControlName="occupancyThreshold" placeholder="npr. 0.75" min="0" max="1" step="0.01" class="hours-input" />
          </div>
          <span class="hint" *ngIf="form.get('occupancyThreshold')?.touched && form.get('occupancyThreshold')?.invalid">
            Vrednost između 0 i 1
          </span>
          <span class="field-desc">Popunjenost zone (0–1, npr. 0.75 = 75%)</span>
        </div>
        <div class="form-group">
          <label>Vremenski prag (sati do utakmice)</label>
          <div class="hours-row">
            <select formControlName="hoursConditionAtLeast" class="hours-select">
              <option [ngValue]="false">Manje od</option>
              <option [ngValue]="true">Više od</option>
            </select>
            <input type="number" formControlName="hoursBeforeMatch" placeholder="npr. 72" min="1" class="hours-input" />
            <span class="hours-label">sati</span>
          </div>
          <span class="hint" *ngIf="form.get('hoursBeforeMatch')?.touched && form.get('hoursBeforeMatch')?.invalid">
            Minimum 1 sat
          </span>
        </div>
      </div>

      <div class="section-title">Promena cene</div>

      <div class="form-group">
        <label>Procenat promene (%)</label>
        <input type="number" formControlName="changePercent" placeholder="npr. 20 ili -10" step="0.01" />
        <span class="field-desc">+20 = skuplje 20%, −10 = jeftinije 10%</span>
      </div>

      <div class="section-title">Granice cene <span class="optional">(opcionalno)</span></div>

      <div class="form-row">
        <div class="form-group">
          <label>Minimalna cena (RSD)</label>
          <input type="number" formControlName="minPrice" placeholder="npr. 300" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label>Maksimalna cena (RSD)</label>
          <input type="number" formControlName="maxPrice" placeholder="npr. 2000" min="0" step="0.01" />
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="active" />
          Pravilo je aktivno
        </label>
      </div>

      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="router.navigate(['/pricing-rules'])">Otkaži</button>
        <button type="submit" class="btn-primary" [disabled]="loading || form.invalid">
          {{ loading ? 'Čuvanje...' : (isEdit ? 'Sačuvaj izmene' : 'Dodaj pravilo') }}
        </button>
      </div>
    </form>
  </div>
</div>
