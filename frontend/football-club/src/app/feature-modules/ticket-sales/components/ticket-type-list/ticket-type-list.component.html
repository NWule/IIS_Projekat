<div class="page-container">
  <div class="page-header">
    <h1>Tipovi karata</h1>
    <button class="btn-add" (click)="add()">+ Dodaj tip karte</button>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

  <div *ngIf="!loading">
    <div *ngIf="ticketTypes.length === 0" class="empty-state">Nema unetih tipova karata.</div>

    <table *ngIf="ticketTypes.length > 0" class="data-table">
      <thead>
        <tr>
          <th>Naziv</th>
          <th>Opis</th>
          <th>Modifikator cene</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tt of ticketTypes">
          <td><strong>{{ tt.name }}</strong></td>
          <td class="desc-cell">{{ tt.description }}</td>
          <td>
            <span class="modifier-badge">×{{ tt.priceModifier }}</span>
          </td>
          <td class="actions">
            <button class="btn-edit" (click)="edit(tt.id!)">Izmeni</button>
            <button class="btn-delete" (click)="delete(tt)">Obriši</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
