<div class="page-container">
  <h1>Cene karata po utakmici</h1>

  <div class="game-select-card">
    <label>Izaberi utakmicu</label>
    <select [(ngModel)]="selectedGameId" (ngModelChange)="onGameChange()" class="game-select">
      <option [ngValue]="null" disabled>-- Izaberi utakmicu --</option>
      <option *ngFor="let game of games" [ngValue]="game.id">{{ getGameLabel(game) }}</option>
    </select>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-msg">{{ successMessage }}</div>

  <div *ngIf="!loading && selectedGameId && zonePrices.length > 0" class="zones-table">
    <div class="table-header">
      <span>Zona</span>
      <span>Default cena</span>
      <span>Cena za ovu utakmicu</span>
      <span>Efektivna cena</span>
      <span></span>
    </div>
    <div class="table-row" *ngFor="let zp of zonePrices">
      <span class="zone-name">
        <span class="zone-dot" [style.background]="zp.zoneColor"></span>
        {{ zp.zoneName }}
      </span>
      <span class="price-default">{{ zp.defaultPrice | number:'1.2-2' }} RSD</span>
      <span>
        <input type="number" [(ngModel)]="editValues[zp.zoneId]" min="0" step="0.01"
               class="price-input" placeholder="Ostavi prazno za default" />
      </span>
      <span class="price-effective" [class.custom]="zp.customPrice != null">
        {{ zp.effectivePrice | number:'1.2-2' }} RSD
        <span *ngIf="zp.customPrice != null" class="custom-badge">custom</span>
      </span>
      <span>
        <button class="btn-save" (click)="save(zp)">Sačuvaj</button>
      </span>
    </div>
  </div>

  <div *ngIf="!selectedGameId" class="empty-state">Izaberi utakmicu da vidiš i editovaš cene po zonama.</div>
</div>
