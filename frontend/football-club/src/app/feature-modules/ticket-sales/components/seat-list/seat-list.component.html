<div class="page-container">
  <div class="page-header">
    <div>
      <button class="btn-back" (click)="goBack()">← Nazad</button>
      <h1>Sedišta{{ zone ? ' — ' + zone.name : '' }}</h1>
    </div>
    <div class="header-right">
      <div class="zone-badge" *ngIf="zone" [style.background]="zone.color">
        {{ zone.name }} · {{ zone.basePrice | number:'1.2-2' }} RSD
      </div>
      <button class="btn-generate" (click)="generateSeats()" [disabled]="generating">
        {{ generating ? 'Generisanje...' : '⚡ Generiši sedišta' }}
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje sedišta...</div>
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

  <div *ngIf="!loading && seats.length === 0" class="empty-state">
    Nema unetih sedišta za ovu zonu.
  </div>

  <div *ngIf="!loading && seats.length > 0">
    <p class="count-info">Ukupno: {{ seats.length }} sedišta</p>

    <div *ngFor="let row of rowGroups" class="row-block">
      <div class="row-label">Red {{ row }}</div>
      <div class="seats-row">
        <div *ngFor="let seat of seatsInRow(row)"
             class="seat-chip"
             [class]="'seat-chip ' + statusClass(seat.status)">
          <span class="seat-num">{{ seat.seatNumber }}</span>
          <span class="seat-status-dot"></span>

          <div class="seat-actions" *ngIf="editingSeatId !== seat.id">
            <button class="btn-mini-edit" (click)="startEdit(seat)">✎</button>
            <button class="btn-mini-del" (click)="deleteSeat(seat)">✕</button>
          </div>

          <div class="seat-edit-inline" *ngIf="editingSeatId === seat.id">
            <select [(ngModel)]="editingStatus" class="status-select">
              <option *ngFor="let s of statusOptions" [value]="s">{{ statusLabel(s) }}</option>
            </select>
            <button class="btn-mini-save" (click)="saveStatus(seat)">✓</button>
            <button class="btn-mini-cancel" (click)="cancelEdit()">✕</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
