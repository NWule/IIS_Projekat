<div class="page-container">
  <h1>{{ title }}</h1>
  <div *ngIf="fetchLoading" class="loading">Učitavanje...</div>

  <div class="form-card" *ngIf="!fetchLoading">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Naziv tipa karte *</label>
        <input type="text" formControlName="name" placeholder="npr. Standardna, VIP, Sezonska" />
        <span class="hint" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Obavezno polje</span>
      </div>

      <div class="form-group">
        <label>Opis pogodnosti *</label>
        <textarea formControlName="description" rows="3" placeholder="Opišite šta uključuje ovaj tip karte..."></textarea>
        <span class="hint" *ngIf="form.get('description')?.touched && form.get('description')?.invalid">Obavezno polje</span>
      </div>

      <div class="form-group">
        <label>Modifikator cene *</label>
        <input type="number" formControlName="priceModifier" placeholder="1.00" min="0.01" step="0.01" />
        <span class="hint" *ngIf="form.get('priceModifier')?.touched && form.get('priceModifier')?.invalid">
          Mora biti veće od 0
        </span>
        <div class="preview-box" *ngIf="form.get('priceModifier')?.value">
          Primer: bazna cena 100 RSD × {{ form.get('priceModifier')?.value }} = <strong>{{ previewPrice | number:'1.2-2' }} RSD</strong>
        </div>
      </div>

      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="router.navigate(['/ticket-types'])">Otkaži</button>
        <button type="submit" class="btn-primary" [disabled]="loading || form.invalid">
          {{ loading ? 'Čuvanje...' : (isEdit ? 'Sačuvaj izmene' : 'Dodaj tip karte') }}
        </button>
      </div>
    </form>
  </div>
</div>
