<div class="page-container">
  <h1>Pretraga utakmica</h1>

  <div class="filter-card">
    <form [formGroup]="form" (ngSubmit)="search()">
      <div class="filter-row">
        <div class="filter-group">
          <label>Protivnik</label>
          <input type="text" formControlName="opponent" placeholder="Naziv kluba" />
        </div>
        <div class="filter-group">
          <label>Od datuma</label>
          <input type="date" formControlName="startDate" />
        </div>
        <div class="filter-group">
          <label>Do datuma</label>
          <input type="date" formControlName="endDate" />
        </div>
        <div class="filter-group">
          <label>Min. cena (RSD)</label>
          <input type="number" formControlName="minPrice" placeholder="0" min="0" />
        </div>
        <div class="filter-group">
          <label>Max. cena (RSD)</label>
          <input type="number" formControlName="maxPrice" placeholder="9999" min="0" />
        </div>
      </div>
      <div class="filter-actions">
        <button type="submit" [disabled]="loading">Pretraži</button>
        <button type="button" class="btn-secondary" (click)="reset()">Resetuj</button>
      </div>
    </form>
  </div>

  <div *ngIf="loading" class="loading">Učitavanje...</div>
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

  <div *ngIf="!loading && searched">
    <div *ngIf="results.length === 0" class="empty-state">
      Nema dostupnih utakmica za zadatu pretragu.
    </div>

    <table *ngIf="results.length > 0" class="match-table">
      <thead>
        <tr>
          <th>Datum i vreme</th>
          <th>Domaćin</th>
          <th>Gost</th>
          <th>Najniža cena</th>
          <th>Akcija</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let match of results">
          <td>{{ match.matchDate | date:'dd.MM.yyyy HH:mm' }}</td>
          <td>{{ match.homeClubName }}</td>
          <td>{{ match.awayClubName }}</td>
          <td>
            <span *ngIf="match.lowestPrice !== null">{{ match.lowestPrice | number:'1.2-2' }} RSD</span>
            <span *ngIf="match.lowestPrice === null" class="no-price">–</span>
          </td>
          <td>
            <button class="btn-primary" (click)="goToStadiumMap(match.id)">Izaberi sedište</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
