<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{ requestToEdit ? 'Izmeni skauting zahtev' : 'Novi skauting zahtev' }}</h3>
      <button class="close-btn" (click)="onClose(false)">&times;</button>
    </div>

    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="instructions">Instrukcije za skauta</label>
        <textarea 
          id="instructions" 
          formControlName="instructions" 
          class="form-control" 
          rows="4" 
          placeholder="Unesite na šta skaut treba da obrati pažnju..."></textarea>
      </div>

      <div class="form-group">
        <label for="deadline">Rok (Deadline)</label>
        <input 
          type="datetime-local" 
          id="deadline" 
          formControlName="deadline" 
          class="form-control" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="onClose(false)">Odustani</button>
        <button type="submit" class="btn btn-primary" [disabled]="requestForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Čuvanje...' : (requestToEdit ? 'Sačuvaj izmene' : 'Pošalji zahtev') }}
        </button>
      </div>
    </form>
  </div>
</div>
