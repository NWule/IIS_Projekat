<div class="wishlist-container">
  <div class="header-section">
    <div>
      <h2>Moje Liste Želja</h2>
      <p>Upravljajte listama igrača koje pratite za buduće transfere.</p>
    </div>
    <button class="btn btn-primary" (click)="openCreateModal()">
      + Nova Lista
    </button>
  </div>

  <div *ngIf="isLoading" class="state-msg">Učitavanje...</div>

  <div class="wishlist-grid" *ngIf="!isLoading">
    <div class="wishlist-card" *ngFor="let list of wishlists">
      <div class="card-header">
        <h3>{{ list.name }}</h3>
        <div class="actions">
          <button class="icon-btn edit" (click)="openEditModal(list)" title="Izmeni naziv">✎</button>
          <button class="icon-btn delete" (click)="deleteWishlist(list.id)" title="Obriši listu">🗑</button>
        </div>
      </div>

      <div class="card-body">
        <p class="count-text">{{ list.players.length }} igrača na listi</p>
        <ul class="player-list">
          <li *ngFor="let player of list.players" class="player-item">
            <a [routerLink]="['/view-player', player.id]" class="player-link">
              {{ player.name }} {{ player.surname }}
            </a>
            <button 
              class="btn-remove-player" 
              (click)="removePlayer(list.id, player.id)" 
              title="Ukloni sa liste">
              &times;
            </button>
          </li>
          <li *ngIf="list.players.length === 0" class="empty-list">
            Lista je trenutno prazna.
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="isModalOpen">
  <div class="modal-content">
    <h3>{{ editingWishlistId ? 'Izmeni naziv liste' : 'Nova lista želja' }}</h3>
    <form [formGroup]="wishlistForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Naziv liste</label>
        <input type="text" formControlName="name" class="form-control" placeholder="Npr. Zimski prelazni rok 2026">
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Odustani</button>
        <button type="submit" class="btn btn-primary" [disabled]="wishlistForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Čuvanje...' : 'Sačuvaj' }}
        </button>
      </div>
    </form>
  </div>
</div>
