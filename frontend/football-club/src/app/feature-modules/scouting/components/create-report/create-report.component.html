<div class="scout-form-container">
  <div class="form-header">
    <h2>Draft Skauting Izveštaja</h2>
    <p>Napravi novu evaluacioni profil perfomansi igrača.</p>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group primary-selection">
      <label for="playerId">Za Igrača</label>
      <select id="playerId" formControlName="playerId" class="form-control">
        <option value="" disabled>-- Izaberi igrača --</option>
        <option *ngFor="let p of players" [value]="p.id">
          {{ p.surname }}, {{ p.name }}
        </option>
      </select>
    </div>

    <div *ngIf="reportForm.get('playerId')?.value" class="fade-in-section">
      
      <div class="form-group">
        <label for="clubAtTimeId">Igrao za klub (Tokom skautinga)</label>
        <select id="clubAtTimeId" formControlName="clubAtTimeId" class="form-control">
          <option value="" disabled>-- Izaberi klub --</option>
          <option *ngFor="let history of playerHistory" [value]="history.clubId">
            {{ history.clubName }} ({{ history.contractStart | date:'yyyy' }} - {{ history.contractEnd ? (history.contractEnd | date:'yyyy') : 'Present' }})
          </option>
        </select>
        <small class="hint-text" *ngIf="playerHistory.length === 0">
          Dobavljanje istorije karijere ili ne postoje zapisi...
        </small>
      </div>

      <div class="form-group">
        <label for="overallCommentary">Opšte taktičke primedbe</label>
        <textarea 
          id="overallCommentary" 
          formControlName="overallCommentary" 
          class="form-control textarea-large" 
          placeholder="Unesite opšte taktičke primedbe...">
        </textarea>
        <small class="error-text" *ngIf="reportForm.get('overallCommentary')?.touched && reportForm.get('overallCommentary')?.hasError('required')">
          Opšte taktičke primedbe su obavezne.
        </small>
      </div>

      <hr class="section-divider">

      <div class="metrics-container" formGroupName="metrics">
        <h3>Evaluacije metrika</h3>
        
        <div class="category-block" *ngFor="let category of categories">
          <h4 class="category-title">{{ formatCategoryName(category) }}</h4>
          
          <div class="metrics-grid">
            <div class="metric-input-card" *ngFor="let metric of metricsByCategory[category]">
              
              <label [for]="'metric-' + metric.id">{{ metric.name }}</label>
              <input 
                type="number" 
                [id]="'metric-' + metric.id" 
                [formControlName]="metric.id.toString()" 
                class="form-control mini-input" 
                placeholder="0.0"
                step="0.1" />
            </div>
          </div>

        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/scouting">Odustani</button>
        <button type="submit" class="btn btn-primary" [disabled]="reportForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Prenosim podatke...' : 'Podnesi izveštaj' }}
        </button>
      </div>

    </div>
  </form>
</div>
