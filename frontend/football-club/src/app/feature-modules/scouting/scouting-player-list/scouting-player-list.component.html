<div class="dashboard-container">
  <div class="header-section">
    <h2>Scouting Roster Catalog</h2>
    <span class="player-count">Total Players: {{ players.length }}</span>
  </div>
  
  <div *ngIf="errorMessage" class="error-banner">
    {{ errorMessage }}
  </div>

  <div class="player-grid">
    <div 
      class="player-card" 
      *ngFor="let player of players" 
      (click)="viewDetails(player.id)"
      tabindex="0"
      (keydown.enter)="viewDetails(player.id)">
      
      <div class="card-header">
        <h3>{{ player.surname }}, {{ player.name }}</h3>
        <span class="position-badge" [ngClass]="player.position?.toLowerCase()">
          {{ formatPosition(player.position) }}
        </span>
      </div>
      
      <div class="card-body">
        <div class="info-row">
          <span class="label">Born:</span>
          <span class="value">{{ player.dateOfBirth | date:'mediumDate' }}</span>
        </div>
      </div>
      
      <div class="card-footer">
        <span class="action-link">View Deep Profile →</span>
      </div>
    </div>
  </div>
</div>
