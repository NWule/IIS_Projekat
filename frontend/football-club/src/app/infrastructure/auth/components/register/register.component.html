<div class="auth-container">
  <div class="auth-card">
    <h2>Registracija</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Korisničko ime</label>
        <input type="text" formControlName="username" placeholder="Minimum 3 karaktera" />
        <span class="hint" *ngIf="form.get('username')?.touched && form.get('username')?.errors?.['minlength']">
          Minimum 3 karaktera
        </span>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="primer@email.com" />
        <span class="hint" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['email']">
          Unesite validan email
        </span>
      </div>
      <div class="form-group">
        <label>Lozinka</label>
        <input type="password" formControlName="password" placeholder="Minimum 6 karaktera" />
        <span class="hint" *ngIf="form.get('password')?.touched && form.get('password')?.errors?.['minlength']">
          Minimum 6 karaktera
        </span>
      </div>
      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Registracija...' : 'Registruj se' }}
      </button>
    </form>
    <p class="auth-link">Već imate nalog? <a routerLink="/login">Prijavite se</a></p>
  </div>
</div>
