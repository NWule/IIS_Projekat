<div class="auth-container">
  <div class="auth-card">
    <h2>Dobrodošli nazad!</h2>
    <p>Unesite vaše podatke kako bi ste se ulogovali.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Korisničko Ime</label>
        <input type="text" id="username" formControlName="username" placeholder="Unesite korisničko ime..." />
      </div>

      <div class="form-group">
        <label for="password">Šifra</label>
        <input type="password" id="password" formControlName="password" placeholder="Unesite vašu šifru..." />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">Uloguj Se</button>
    </form>

    <div class="auth-footer">
      Nemate nalog? <a routerLink="/register">Registrujte se!</a>
    </div>
  </div>
</div>
