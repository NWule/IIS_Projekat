<div class="auth-container">
  <div class="auth-card">
    <h2>Create an Account</h2>
    <p>Enter your details to register.</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" formControlName="name" placeholder="John" />
        </div>
        <div class="form-group">
          <label for="surname">Surname</label>
          <input type="text" id="surname" formControlName="surname" placeholder="Doe" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="john@example.com" />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="Choose a username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Create a password" />
      </div>

      <div class="form-group">
        <label for="role">Select Role</label>
        <select id="role" formControlName="role">
          <option value="" disabled selected>Choose a role...</option>
          <option *ngFor="let role of roles" [value]="role">
            {{ role }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="clubId">Select Club</label>
        <select id="clubId" formControlName="clubId">
          <option value="" disabled selected>Choose a club...</option>
          <option *ngFor="let club of availableClubs" [value]="club.id">
            {{ club.name }}
          </option>
        </select>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-primary">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
