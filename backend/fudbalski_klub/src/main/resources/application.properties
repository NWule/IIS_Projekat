spring.application.name=fudbalski_klub

### POSTGRES DATABASE ###
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/football_club}
spring.datasource.username=postgres
spring.datasource.password=root

### JPA HIBERNATE ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

### JWT ###
jwt.secret=a-valid-string-secret-that-is-at-least-512-bits-long-which-is-very-long

### INFLUXDB ###
influxdb.url=${INFLUXDB_URL:http://influx-db:8086}
influxdb.token=${INFLUXDB_TOKEN:MOJ_SUPER_TAJNI_INFLUXDB_TOKEN_KOJI_PROSTIRE_DO_BAZE}
influxdb.org=moj-fudbalski-klub
influxdb.bucket=match-tracking

### NEO4J ###
spring.neo4j.uri=${SPRING_NEO4J_URI:bolt://neo4j-db:7687}
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

### LOGGING ###
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=DEBUG

### LLM SERVICE ###
football.ai-service.base-url=${FOOTBALL_AI_SERVICE_BASE_URL:http://ai-rest-api:8000}

### API FOOTBALL ###
api.football.base-url=${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
api.football.key=${API_FOOTBALL_KEY}